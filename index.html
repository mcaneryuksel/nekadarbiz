<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#170a12">
<meta name="robots" content="noindex,nofollow">
<title>Ne Kadar Biz?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;700&display=swap">
<style>
/* Gece yarısı bordo sahne: tek koyu görünüm, altın vurgu, yeşil/kırmızı yalnızca sonuç anında. */
:root{
  color-scheme:dark;
  --night:#170a12; --wine:#3d1026; --plum:#26101f;
  --gold:#ecc98f; --cream:#fbf0e4; --mute:#c9b1b4; --line:rgba(251,240,228,.14);
  --good:#0b8f58; --good2:#075c3a; --bad:#cf1b3a; --bad2:#7c0c22;
  --serif:'Cormorant Garamond','Times New Roman',serif;
  --sans:'Manrope',-apple-system,'Helvetica Neue',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 0%,var(--wine),var(--night) 70%);background-color:var(--night);color:var(--cream);font:400 16px/1.45 var(--sans);overflow:hidden;overscroll-behavior:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;height:100%;height:100dvh;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;gap:18px;
  padding-block:max(18px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-bottom));
  padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right));
  width:100%;max-width:520px;margin:0 auto}
.rise>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.rise>*:nth-child(2){animation-delay:.07s}.rise>*:nth-child(3){animation-delay:.14s}.rise>*:nth-child(4){animation-delay:.21s}.rise>*:nth-child(5){animation-delay:.28s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
h1,h2,p{margin:0}
h1{font:italic 500 clamp(52px,16vw,76px)/.95 var(--serif);text-wrap:balance;letter-spacing:-.01em}
h2{font:500 clamp(31px,8.6vw,42px)/1.08 var(--serif);text-wrap:balance}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.mute{color:var(--mute)}
.grow{flex:1}
button,input{font:inherit;color:inherit}
.btn{appearance:none;border:0;border-radius:16px;background:var(--gold);color:#2a1016;font-weight:700;font-size:17px;padding:17px 22px;width:100%;cursor:pointer;transition:transform .15s,opacity .25s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.link{appearance:none;background:none;border:0;color:var(--mute);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px;align-self:center}

/* Fotoğraflar: kenarı sahneye eriyen portreler */
.av{display:inline-grid;place-items:center;flex:none;background:var(--wine) center/cover no-repeat;border-radius:50%;
  -webkit-mask-image:radial-gradient(closest-side,#000 74%,transparent 100%);mask-image:radial-gradient(closest-side,#000 74%,transparent 100%);
  font:italic 600 1em var(--serif);color:var(--gold)}
.ghost{position:fixed;top:-4vh;right:-18vw;width:min(105vw,560px);aspect-ratio:1;background:center/cover no-repeat;opacity:.24;pointer-events:none;z-index:0;
  -webkit-mask-image:radial-gradient(closest-side,#000 25%,transparent 100%);mask-image:radial-gradient(closest-side,#000 25%,transparent 100%);animation:ghost .9s ease both}
@keyframes ghost{from{opacity:0;transform:scale(1.08)}}

/* Giriş */
.stage{position:relative;height:44vh;max-height:400px;margin:-18px -20px 0;flex:none}
.stage div{position:absolute;inset:0;background:center 30%/cover no-repeat;opacity:0;transition:opacity .7s ease;
  -webkit-mask-image:linear-gradient(#000 45%,transparent 98%),linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(#000 45%,transparent 98%),linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-composite:intersect}
.stage div.on{opacity:1}
.field{display:flex;flex-direction:column;gap:12px}
#name,#when{width:100%;min-height:58px;-webkit-appearance:none;appearance:none;color:var(--cream);background:rgba(251,240,228,.08);border:1px solid var(--line);border-radius:16px;padding:16px 18px;font-size:18px;outline:0;transition:border-color .2s}
#name:focus,#when:focus{border-color:var(--gold)}
#name::placeholder{color:var(--mute)}

/* Bekleme odası */
.pair{position:relative;height:min(62vw,290px);flex:none;display:flex;justify-content:center;margin-top:6px}
.half{position:relative;width:54%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:filter .7s,opacity .7s}
.half:first-child{margin-right:-8%}.half:last-child{margin-left:-8%}
.half .av{width:100%;aspect-ratio:1;font-size:64px;
  -webkit-mask-image:radial-gradient(closest-side,#000 42%,transparent 100%);mask-image:radial-gradient(closest-side,#000 42%,transparent 100%)}
.half.off{filter:grayscale(1) brightness(.42) blur(2px);opacity:.75}
.tags{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}
.tag strong{display:block;font:italic 600 26px/1.1 var(--serif)}
.tag span{font-size:13px;color:var(--mute)}
.tag span.ok{color:var(--gold)}
.rules{display:grid;gap:9px;font-size:15px;color:var(--mute)}
.rules b{color:var(--cream);font-weight:500}

/* Üst skor: her oyuncu için bölüm bölüm ilerleme */
.hud{display:grid;gap:7px;flex:none;position:relative;z-index:2}
.hudrow{display:grid;grid-template-columns:34px 1fr 26px;align-items:center;gap:9px}
.hud .av{width:34px;height:34px;font-size:15px}
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.segs i{height:7px;border-radius:2px;background:rgba(251,240,228,.14);transition:background .5s}
.segs i.good{background:#27c27f}.segs i.bad{background:#ee3e5b}
.segs i.now{background:rgba(236,201,143,.65);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.score{font:600 22px/1 var(--serif);text-align:right;font-variant-numeric:lining-nums tabular-nums}

/* Soru */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;position:relative}
.ask{display:flex;flex-direction:column;gap:9px;position:relative}
.who{font:italic 500 24px/1.1 var(--serif);color:var(--gold)}
.opts{display:grid;gap:10px;position:relative}
.opt{appearance:none;text-align:left;background:rgba(32,12,24,.62);border:1px solid var(--line);border-radius:15px;padding:16px 18px;font-size:17px;font-weight:500;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .22s,color .22s,opacity .3s,transform .22s,border-color .22s}
.opt:active{transform:scale(.98)}
.opts.lock .opt{pointer-events:none;opacity:.25}
.opts.lock .opt.pick{opacity:1;background:var(--gold);border-color:var(--gold);color:#2a1016;transform:scale(1.02)}
.live{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--mute);position:relative;min-height:22px}
.dot{width:7px;height:7px;border-radius:50%;background:#6c5560;transition:background .3s}
.dot.on{background:#3fe29a;box-shadow:0 0 9px #3fe29a}

/* Karşı tarafı bekleme */
.wait{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.wait .av{width:min(66vw,280px);height:min(66vw,280px);font-size:80px;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05);opacity:.76}}

/* 3-2-1: iki portre her sayıda birbirine yaklaşır */
.count{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}
.duo{position:absolute;top:50%;left:50%;width:0;height:0}
.duo .av{position:absolute;top:-23vw;width:46vw;height:46vw;max-width:220px;max-height:220px;font-size:60px;transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.duo .av:first-child{right:0;transform:translateX(calc(var(--g) * -1))}
.duo .av:last-child{left:0;transform:translateX(var(--g))}
.num{position:relative;font:italic 600 clamp(150px,44vw,220px)/1 var(--serif);font-variant-numeric:lining-nums;color:var(--cream);text-shadow:0 6px 34px rgba(0,0,0,.65)}
.num.hit{animation:hit .8s cubic-bezier(.2,.9,.3,1) both}
@keyframes hit{0%{transform:scale(1.9);opacity:0}30%{opacity:1}100%{transform:none;opacity:.92}}

/* Sonuç: dokunulan merkezden tüm ekrana yayılan renk */
.result{position:fixed;inset:0;z-index:3;display:flex;justify-content:center;animation:wash .75s cubic-bezier(.3,.8,.3,1) both}
.result.good{background:radial-gradient(120% 90% at 50% 18%,#15b873,var(--good) 45%,var(--good2))}
.result.bad{background:radial-gradient(120% 90% at 50% 18%,#ef3454,var(--bad) 45%,var(--bad2))}
@keyframes wash{from{clip-path:circle(0 at 50% 42%)}to{clip-path:circle(150% at 50% 42%)}}
.result .screen{color:#fff;--cream:#fff}
.verdict{display:flex;align-items:center;gap:14px}
.verdict svg{width:52px;height:52px;flex:none}
.verdict h1{font-size:clamp(58px,17vw,84px)}
.panel{background:rgba(0,0,0,.24);border-radius:16px;padding:14px 16px;display:grid;gap:9px}
.line{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:baseline}
.line span{font-size:13px;color:rgba(255,255,255,.78)}
.line b{font-weight:700;font-size:17px;min-width:0}
.ph{display:flex;align-items:center;gap:10px;font-weight:700}
.ph .av{width:38px;height:38px;font-size:16px}
.badge{margin-left:auto;font-size:12px;padding:5px 10px;border-radius:99px;letter-spacing:.02em}
.badge.good{background:#fff;color:#075c3a}.badge.bad{background:#fff;color:#a30f29}
.same{font:italic 600 21px/1.2 var(--serif);text-align:center}
.result .btn{background:#fff;color:#1d0d12}

/* Final */
.hero{position:relative;height:40vh;max-height:370px;margin:-18px -20px 0;flex:none;background:center 35%/cover no-repeat;
  -webkit-mask-image:linear-gradient(#000 50%,transparent 98%),linear-gradient(90deg,transparent,#000 13%,#000 87%,transparent);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(#000 50%,transparent 98%),linear-gradient(90deg,transparent,#000 13%,#000 87%,transparent);mask-composite:intersect}
.final{text-align:center}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.side{display:flex;flex-direction:column;align-items:center;gap:6px}
.side .av{width:84px;height:84px;font-size:36px}
.side.win .av{box-shadow:0 0 0 2px var(--gold)}
.side strong{font:italic 600 22px/1 var(--serif)}
.big{font:600 44px/1 var(--serif);font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.vs{font:italic 500 22px var(--serif);color:var(--mute)}
.pad{position:relative;width:min(100%,44vh);aspect-ratio:1;margin:0 auto;border-radius:18px;overflow:hidden;box-shadow:0 14px 44px rgba(0,0,0,.5);flex:none}
.pad canvas{width:100%;height:100%;display:block;touch-action:none;background:#fbf0e4;cursor:crosshair}
.pad.small{width:min(62%,30vh)}
.timer{position:absolute;top:8px;right:12px;font:600 24px var(--serif);color:#3d1026;font-variant-numeric:lining-nums tabular-nums;pointer-events:none}
.timer.low{color:#cf1b3a}
.tools{display:grid;grid-template-columns:auto auto 1fr;gap:8px}
.tool{appearance:none;background:rgba(251,240,228,.08);border:1px solid var(--line);border-radius:14px;padding:0 14px;font-weight:700;font-size:14px;cursor:pointer}
.tool:active{transform:scale(.96)}
.opts.two{grid-template-columns:1fr 1fr}.opts.two .opt{padding:13px 12px;font-size:15px}
.final .hero{height:30vh}
.wheelbox{position:relative;width:min(80vw,310px);aspect-ratio:1;margin:4px auto 0;flex:none}
.wheel{width:100%;height:100%;display:block;transition:transform 5.2s cubic-bezier(.1,.7,.12,1);filter:drop-shadow(0 14px 30px rgba(0,0,0,.5))}
.pin{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:24px solid var(--gold);z-index:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.penalty{font:italic 600 27px/1.2 var(--serif);color:var(--gold);text-align:center;text-wrap:balance;min-height:1.2em}
.penalty.show{animation:fadein .6s ease both}
@keyframes fadein{from{opacity:0}}
.gate{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>

/* ---------- Yardımcılar ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').trim().split(/\s+/)[0].toLocaleLowerCase('tr').normalize('NFD').replace(/\p{M}/gu,'').replace(/ı/g,'i');
const b64=u=>Uint8Array.from(atob(u.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const toB64=b=>{let s='';b.forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
const LS='nekadarbiz'+location.search;
const blank=()=>({name:'',seat:'',n:0,g:0,ready:-1,ans:[],ink:{},spin:null});
let me=blank(); try{me={...blank(),...JSON.parse(localStorage.getItem(LS)||'{}')}}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(me))}catch(e){}};
const peers={a:null,b:null}, seen={a:0,b:0};
let key=null, base='', photos={}, clients=[], echoed=true, curKey='', liveFn=null, cdToken=0;
const counted=new Set(), liveInk={};
let shownSpin=0;
function resetGame(g){me.g=g;me.ready=-1;me.ans=[];me.ink={};me.spin=null}

const photoOf=name=>{const n=norm(name);return n==='ayca'||n==='balim'?photos.ayca:n==='can'?photos.can:null};
const av=(name,cls='')=>{const p=photoOf(name);return `<span class="av ${cls}" ${p?`style="background-image:url(${p})"`:''}>${p?'':esc(String(name||'?').charAt(0).toLocaleUpperCase('tr'))}</span>`};
const otherSeat=()=>me.seat==='a'?'b':'a';
function other(){const o=peers[otherSeat()];if(!o)return null;return o.g===me.g?o:{...o,ready:-1,ans:[],ink:{},spin:null}}
const oName=()=>other()?.name||'Sevgilin';
const online=()=>Date.now()-seen[otherSeat()]<22000;
const label=(t,mode,name)=>t==='{self}'?(mode==='self'?'Ben':name):t==='{other}'?(mode==='self'?name:'Ben'):t;
const hit=(p,q,i)=>{const x=p.ans[i],y=q.ans[i];return x&&y&&x[1]===y[0]};
function agree(i,x,y){if(Q[i].draw)return false;if(Q[i].o&&Q[i].o[0]==='{self}'&&y<2)y=1-y;return x===y}

/* ---------- Şifre + canlı bağlantı ---------- */
async function seal(obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj))));const all=new Uint8Array(12+ct.length);all.set(iv);all.set(ct,12);return toB64(all)}
async function open_(txt){const all=b64(txt);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:all.slice(0,12)},key,all.slice(12));return new TextDecoder().decode(pt)}

async function publish(){
  if(!me.seat)return;
  const body=await seal(me);
  clients.forEach(c=>{if(c.connected)c.publish(base+'/'+me.seat,body,{retain:true,qos:1})});
}
async function sendInk(r,d,t){
  const body=await seal({s:me.seat,g:me.g,r,d,t});
  clients.forEach(c=>{if(c.connected)c.publish(base+'/ink',body,{retain:false,qos:0})});
}
function connect(){
  const urls=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
  clients=urls.map(u=>{
    const c=mqtt.connect(u,{clean:true,reconnectPeriod:2500,connectTimeout:8000,keepalive:25,clientId:'nkb_'+Math.random().toString(16).slice(2,14)});
    c.on('connect',()=>{c.subscribe(base+'/+',{qos:1});publish();render()});
    c.on('close',()=>render());
    c.on('error',()=>{});
    c.on('message',async(t,buf,pkt)=>{
      const seat=t.split('/').pop(); if(seat!=='a'&&seat!=='b'&&seat!=='ink')return;
      let o; try{o=JSON.parse(await open_(buf.toString()))}catch(e){return}
      if(seat==='ink'){if(o.s!==me.seat&&o.g===me.g){liveInk[o.r]={d:o.d,t:o.t};seen[o.s]=Date.now();liveFn&&liveFn()}return}
      receive(seat,o,pkt.retain);
    });
    return c;
  });
  setInterval(publish,6000);
  setInterval(()=>liveFn&&liveFn(),3000);
}
const connected=()=>clients.some(c=>c.connected);
function receive(seat,o,retained){
  if(!retained)seen[seat]=Date.now();
  if(o.n<=(peers[seat]?.n||0)){if(seat===me.seat&&o.n>=me.n&&!echoed){echoed=true;render()}else if(liveFn)liveFn();return}
  peers[seat]=o;
  if(seat===me.seat){
    if(o.n>me.n){me={...me,g:o.g,ready:o.ready,ans:o.ans,ink:o.ink||{},spin:o.spin||null,n:o.n};save()}
    if(o.n>=me.n)echoed=true;
  }else if(me.seat&&o.g>me.g){resetGame(o.g);commit();return}
  render();
}
function commit(){me.n=Math.max(Date.now(),me.n+1);echoed=false;save();publish();render()}

/* ---------- Oyun durumu: iki oyuncunun cevabından türetilir ---------- */
function phase(){
  if(!me.name)return{k:'name'};
  const o=other();
  if(me.ready<0||!o||o.ready<0)return{k:'lobby'};
  const r=Math.min(me.ready,o.ready);
  if(r>=N)return{k:'final'};
  const a=me.ans[r]||[],b=o.ans[r]||[];
  if(Q[r].draw&&Q[r].draw!==me.seat&&a[0]!=null&&b[0]==null)return{k:'self',r};
  if(a[0]==null)return{k:'self',r};
  if(a[1]==null)return{k:'guess',r};
  if(b[0]==null||b[1]==null||(!echoed&&!counted.has(me.g+':'+r)))return{k:'wait',r};
  return(counted.has(me.g+':'+r)||me.ready>r)?{k:'reveal',r}:{k:'count',r};
}
function render(){
  if(!key)return;
  const p=phase(), id=[p.k,p.r??'',me.g].join(':');
  if(id===curKey){liveFn&&liveFn();return}
  curKey=id; liveFn=null; cdToken++;
  ({name:vName,lobby:vLobby,self:vAsk,guess:vAsk,wait:vWait,count:vCount,reveal:vReveal,final:vFinal})[p.k](p);
  liveFn&&liveFn();
}

    return `<div class="hudrow">${av(p.name)}<div class="segs">${s}</div><div class="score">${sc}</div></div>`}).join('')}</div>`;
}

const parseInk=v=>{try{return typeof v==='string'?JSON.parse(v):(v||[])}catch(e){return[]}};
function drawInk(cv,st){
  const W=cv.clientWidth||300,D=Math.min(devicePixelRatio||1,2);
  if(cv.width!==Math.round(W*D)){cv.width=Math.round(W*D);cv.height=Math.round(W*D)}
  const c=cv.getContext('2d'),k=cv.width/1000;
  c.fillStyle='#fbf0e4';c.fillRect(0,0,cv.width,cv.height);
  c.strokeStyle=c.fillStyle='#3d1026';c.lineWidth=12*k;c.lineCap=c.lineJoin='round';
  for(const s of st){

    c.beginPath();c.moveTo(s[0]*k,s[1]*k);
    for(let i=2;i<s.length-2;i+=2){const mx=(s[i]+s[i+2])/2,my=(s[i+1]+s[i+3])/2;c.quadraticCurveTo(s[i]*k,s[i+1]*k,mx*k,my*k)}

  }
}

    <div class="grow"></div>
    <button class="btn" id="nx"></button>
    <div class="live" style="color:rgba(255,255,255,.8)"><span id="st"></span></div>
  </div></div>`,c);
  drawInk($('#ink'),ink);
  if(navigator.vibrate)navigator.vibrate(ok?[30,40,30]:120);
  if(ok)fx.burst('#d9ffe9');
  $('#nx').onclick=()=>{if(me.ready<=r){me.ready=r+1;commit()}};
  liveFn=()=>nextBtn(r);
}
function vReveal(p){
  if(Q[p.r].draw)return vRevealDraw(p);
  if(Q[p.r].date)return vRevealDate(p);
  const r=p.r,q=Q[r],o=other(),pn=o.name;
  const a=me.ans[r],b=o.ans[r],mine=a[1]===b[0],theirs=b[1]===a[0],same=agree(r,a[0],b[0]);
  const c=mine?'good':'bad';
  const guessL=label(q.o[a[1]],'guess',pn), herL=label(q.o[b[0]],'guess',pn);
  const hisG=label(q.o[b[1]],'self',pn), myL=label(q.o[a[0]],'self',pn);
  paint(`<div class="result ${c}"><div class="screen rise">
    ${hud(r,r+1)}
    <div class="grow"></div>
    <div class="verdict">${ICON[c]}<h1>${mine?'Bildin':'Bilemedin'}</h1></div>
    <p style="font-size:17px">${esc(q.q)}</p>
    <div class="panel"><div class="line"><span>Tahminin</span><b>${esc(guessL)}</b></div><div class="line"><span>${esc(pn)} seçti</span><b>${esc(herL)}</b></div></div>
    <div class="panel"><div class="ph">${av(pn)}<span>${esc(pn)} seni ${theirs?'bildi':'bilemedi'}</span><span class="badge ${theirs?'good':'bad'}">${theirs?'Doğru':'Yanlış'}</span></div>
      <div class="line"><span>Senin için dedi</span><b>${esc(hisG)}</b></div><div class="line"><span>Sen seçtin</span><b>${esc(myL)}</b></div></div>
    ${same?'<p class="same">İkiniz de aynı şeyi seçtiniz</p>':''}
    <div class="grow"></div>
    <button class="btn" id="nx"></button>
    <div class="live" style="color:rgba(255,255,255,.8)"><span id="st"></span></div>
  </div></div>`,c);
  if(navigator.vibrate)navigator.vibrate(mine?[30,40,30]:120);
  if(mine)fx.burst('#d9ffe9');
  $('#nx').onclick=()=>{if(me.ready<=r){me.ready=r+1;commit()}};
  liveFn=()=>nextBtn(r);
}
function vFinal(){
  const o=other();let mineS=0,theirS=0,ag=0;
  for(let i=0;i<N;i++){if(hit(me,o,i))mineS++;if(hit(o,me,i))theirS++;if(agree(i,me.ans[i][0],o.ans[i][0]))ag++}
  const pct=Math.round(ag/(N-ND)*100),left=me.seat==='a';
  const title=mineS===theirS?'Berabere':mineS>theirS?esc(me.name)+' kazandı':esc(o.name)+' kazandı';
  const line=mineS===theirS?'Birbirinizi aynı derecede iyi tanıyorsunuz.':mineS>theirS?'Sevgilisini daha iyi tanıyan sensin.':'Seni senden iyi tanıyor olabilir.';
  const side=(p,s,w)=>`<div class="side ${w?'win':''}">${av(p.name)}<strong>${esc(p.name)}</strong></div>`;
  const A=side(me,mineS,mineS>theirS),B=side(o,theirS,theirS>mineS);
  const sc=left?`${mineS} – ${theirS}`:`${theirS} – ${mineS}`;
  const tie=mineS===theirS, loser=mineS<theirS?me:o;
  paint(`<div class="screen rise final">
    <div class="hero" style="background-image:url(${photos.biz})"></div>
    <div><p class="eyebrow">${N} turun sonunda</p><h1 style="margin-top:6px">${title}</h1></div>
    <div class="board">${left?A:B}<div class="big">${sc}</div>${left?B:A}</div>
    <p class="mute">${line} Sorularda <b style="color:var(--gold)">%${pct}</b> aynı şeyi seçtiniz.</p>
    <div style="text-align:center;margin-top:8px"><p class="eyebrow">Ceza çarkı</p><p class="mute" style="font-size:14px;margin-top:4px">${tie?'Berabere, ceza ikinize birden. Kim isterse çevirsin.':esc(loser.name)+' çevirecek, ne çıkarsa yapacak.'}</p></div>
    <div class="wheelbox" id="wbox"><span class="pin"></span>${wheelSvg()}</div>
    <p class="penalty" id="pen"></p>
    <button class="btn" id="spin"></button>
    <button class="link" id="again">Yeniden oyna</button>
  </div>`,'final');
  fx.burst('#ecc98f',140);setTimeout(()=>fx.burst('#ffe6c4',110),650);
  $('#again').onclick=()=>{resetGame(me.g+1);commit()};
  let rot=0,spinning=false;
  const latest=()=>{const a=me.spin,b=other()?.spin;return!a?b:!b?a:a.t>b.t?a:b};
  const say=s=>{const t=PEN[s.i][1],pe=$('#pen');pe.textContent=tie?'Ceza ikinize: '+t:loser.name+' '+t;pe.classList.remove('show');void pe.offsetWidth;pe.classList.add('show')};
  const spinTo=(s,anim)=>{
    const w=$('#wheel');rot=Math.ceil(rot/360)*360+(anim?360*6:0)-s.i*45+s.j;
    w.style.transition=anim?'':'none';w.style.transform=`rotate(${rot}deg)`;
    if(!anim){say(s);return}
    spinning=true;$('#pen').textContent='';sync();$('#wbox').scrollIntoView({behavior:'smooth',block:'center'});
    setTimeout(()=>{spinning=false;say(s);fx.burst('#ecc98f',120);if(navigator.vibrate)navigator.vibrate([40,60,40]);sync()},5300);
  };
  const s0=latest();shownSpin=s0?s0.t:0;if(s0)spinTo(s0,false);
  const canSpin=tie||loser===me;
  const sync=()=>{const b=$('#spin');if(!b)return;const s=latest();
    b.disabled=!canSpin||spinning;b.textContent=spinning?'Dönüyor…':!canSpin?esc(loser.name)+' çevirecek':s?'Bir daha çevir':'Çarkı çevir'};
  $('#spin').onclick=()=>{if(!canSpin||spinning)return;me.spin={i:Math.floor(Math.random()*PEN.length),j:Math.round(Math.random()*30-15),t:Date.now()};commit()};
  liveFn=()=>{const s=latest();if(s&&s.t!==shownSpin){shownSpin=s.t;spinTo(s,true)}sync()};
}

function wheelSvg(){
  const R=97,pt=a=>[(R*Math.sin(a*Math.PI/180)).toFixed(2),(-R*Math.cos(a*Math.PI/180)).toFixed(2)];
  let g='';PEN.forEach((p,i)=>{const [x0,y0]=pt(i*45-22.5),[x1,y1]=pt(i*45+22.5);
    g+=`<path d="M0 0L${x0} ${y0}A${R} ${R} 0 0 1 ${x1} ${y1}Z" fill="${i%2?'#3d1026':'#6a1d3c'}" stroke="#ecc98f" stroke-width=".8"/>`+
       `<text transform="rotate(${i*45-90}) translate(60 0)" text-anchor="middle" dominant-baseline="middle" fill="#fbf0e4" font-family="Manrope,sans-serif" font-weight="700" font-size="9.5">${esc(p[0])}</text>`});
  return `<svg class="wheel" id="wheel" viewBox="-100 -100 200 200" role="img" aria-label="Ceza çarkı"><circle r="99" fill="#ecc98f"/>${g}<circle r="15" fill="#ecc98f"/><circle r="6" fill="#3d1026"/></svg>`;
}
/* ---------- Arka plan ışıkları + altın kıvılcım ---------- */
const fx=(()=>{
  const cv=$('#fx'),c=cv.getContext('2d');let W=0,H=0;const D=Math.min(devicePixelRatio||1,1.5);
  const size=()=>{W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;c.setTransform(D,0,0,D,0,0)};size();addEventListener('resize',size);
  const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const orb=[...Array(16)].map(()=>({x:Math.random(),y:Math.random(),r:60+Math.random()*130,dx:(Math.random()-.5)*.00035,dy:-.00012-Math.random()*.0003,a:.05+Math.random()*.1}));
  const spr=document.createElement('canvas');spr.width=spr.height=128;const s=spr.getContext('2d');const g=s.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,255,255,0)');s.fillStyle=g;s.fillRect(0,0,128,128);
  const tint=document.createElement('canvas');tint.width=tint.height=128;const t=tint.getContext('2d');
  let col='#e79a8c';const setTint=h=>{t.globalCompositeOperation='source-over';t.clearRect(0,0,128,128);t.drawImage(spr,0,0);t.globalCompositeOperation='source-in';t.fillStyle=h;t.fillRect(0,0,128,128)};setTint(col);
  let sparks=[],fr=0;
  function loop(){
    requestAnimationFrame(loop);if(document.hidden||(fr++%2))return;
    c.clearRect(0,0,W,H);c.globalCompositeOperation='lighter';
    orb.forEach(o=>{o.x+=o.dx*2;o.y+=o.dy*2;if(o.y<-.25)o.y=1.25;if(o.x<-.25)o.x=1.25;if(o.x>1.25)o.x=-.25;c.globalAlpha=o.a;c.drawImage(tint,o.x*W-o.r,o.y*H-o.r,o.r*2,o.r*2)});
    sparks=sparks.filter(p=>p.l>0);
    sparks.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.09;p.vx*=.985;p.l-=.016;c.globalAlpha=Math.max(p.l,0);c.fillStyle=p.c;c.save();c.translate(p.x,p.y);c.rotate(p.r+=.12);c.fillRect(-p.s,-p.s/3,p.s*2,p.s/1.5);c.restore()});
    c.globalAlpha=1;
  }
  if(!still)loop();
  return{tone(k){const m={guess:'#d98fb0',count:'#ecc98f',final:'#ecc98f',good:'#7fffc0',bad:'#ff8a98'};const h=m[k]||'#e79a8c';if(h!==col){col=h;setTint(h)}},
    burst(color,n=70){if(still)return;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=3+Math.random()*8;sparks.push({x:W/2,y:H*.36,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,l:.7+Math.random()*.55,s:1.5+Math.random()*2.5,r:Math.random()*6,c:color})}}};
})();

/* ---------- Açılış ---------- */
(async()=>{
  try{
    const raw=b64(location.hash.slice(1));if(raw.length!==32)throw 0;
    key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
    const data=JSON.parse(await open_($('#sealed').textContent.trim()));
    for(const k in data){const bin=b64(data[k]);photos[k]=URL.createObjectURL(new Blob([bin],{type:'image/jpeg'}))}
    const h=new Uint8Array(await crypto.subtle.digest('SHA-256',raw));
    base='nekadarbiz/'+[...h].slice(0,16).map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){
    key=null;$('#app').innerHTML='<div class="screen"><div class="gate"><h2>Bu oyun davet linkiyle açılır</h2><p class="mute">Sana gönderilen linkin tamamına dokun.</p></div></div>';return;
  }
  connect();render();
  let lock=null;const wake=async()=>{try{lock=await navigator.wakeLock?.request('screen')}catch(e){}};
  wake();document.addEventListener('visibilitychange',()=>{if(!document.hidden){wake();clients.forEach(c=>{if(!c.connected)c.reconnect()});publish()}});
})();
</script>
